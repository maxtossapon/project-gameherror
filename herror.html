<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>คฤหาสน์วรากุล: ห้องที่เจ็ด</title>

<style>

<div id="t" style="display:flex;flex-direction:column;text-align:center"><h1>คฤหาสน์วรากุล<br>ห้องที่เจ็ด</h1><p style="max-width:520px;line-height:1.7">เกมสืบสวนสยองขวัญ · ใส่หูฟัง · ปิดไฟ · เมาส์/นิ้วคือไฟฉาย<br>คลิกวัตถุที่เรืองรอบๆ เพื่อสำรวจ · อย่าหันหลังบ่อยนัก</p><div class="b" style="background:none;border:0"><button style="font-size:20px;padding:12px 30px" onclick="start()">เข้าไปในบ้าน</button></div></div></div>
<script>
const $=s=>document.querySelector(s),C=$('#c'),X=C.getContext('2d'),Q=$('#d').getContext('2d'),W=1000,H=560,G=$('#g'),Mo=$('#m');
let S={room:'hall',back:0,turns:0,san:100,notes:[],pc:[],slot:[0,0,0,0],photo:0,piano:0,seq:[],box:0,key:0,d:[0,0,0],mx:500,my:280,go:0,eye:null,dark:0,over:0},cur=[],A,MG,NB,mV=1,mS=1;
const R=(c,x,y,w,h)=>{X.fillStyle=c;X.fillRect(x,y,w,h)},rnd=Math.random,
  hs=(id,x,y,w,h,l)=>{cur.push({id,x,y,w,h,l});X.save();X.strokeStyle='rgba(255,220,180,'+(.06+.05*Math.sin(S.t/400+x))+')';X.lineWidth=2;X.strokeRect(x-2,y-2,w+4,h+4);X.restore()};
/* ---------- AUDIO ---------- */
function initA(){if(A)return;A=new(window.AudioContext||window.webkitAudioContext)();MG=A.createGain();MG.gain.value=.8;MG.connect(A.destination);
NB=A.createBuffer(1,A.sampleRate*2,A.sampleRate);let d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;
[55,55.8,82.4,58].forEach(f=>{let o=A.createOscillator(),g=A.createGain(),l=A.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;l.frequency.value=150;g.gain.value=.045;o.connect(l);l.connect(g);g.connect(MG);o.start()});
let n=A.createBufferSource();n.buffer=NB;n.loop=1;let bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=400;bp.Q.value=.7;let wg=A.createGain();wg.gain.value=.06;n.connect(bp);bp.connect(wg);wg.connect(MG);n.start();
let lf=A.createOscillator(),lg=A.createGain();lf.frequency.value=.12;lg.gain.value=300;lf.connect(lg);lg.connect(bp.frequency);lf.start();
(function b(){breath(rnd()<.5?-1:1,.4);setTimeout(b,5000+rnd()*8000-S.san*30)})();(function h(){tone(48,.25,'sine',.5*(1.2-S.san/100));setTimeout(()=>tone(44,.2,'sine',.35*(1.2-S.san/100)),170);setTimeout(h,520+S.san*9)})()}
function tone(f,d,ty='sine',v=.2,pan=0,det=0,f2){if(!A)return;let o=A.createOscillator(),g=A.createGain(),p=A.createStereoPanner(),t=A.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.detune.value=det;p.pan.value=pan;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(p);p.connect(MG);o.start(t);o.stop(t+d)}
function nz(d,v,fr,ty,pan=0,att=.02){if(!A)return;let n=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain(),p=A.createStereoPanner(),t=A.currentTime;n.buffer=NB;f.type=ty;f.frequency.value=fr;p.pan.value=pan;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.linearRampToValueAtTime(0,t+d);n.connect(f);f.connect(g);g.connect(p);p.connect(MG);n.start(t);n.stop(t+d+.1)}
const breath=(s,v=.4)=>{nz(2.3,v,1900,'bandpass',s,1)},creak=()=>{tone(110,1.2,'sawtooth',.12,rnd()-.5,0,55);nz(1,.1,600,'bandpass')},
scream=()=>{tone(1100,1.2,'sawtooth',.5,0,0,150);tone(1180,1.2,'square',.3,0,0,170);nz(1.3,1,2500,'highpass',0,.01)},
bell=(f,pan=0)=>{tone(f,1.4,'triangle',.18,pan,-25);tone(f*2.01,.8,'sine',.05,pan)},
lull=()=>{[659,587,523,587,659,659,659,587,587,587].forEach((f,i)=>setTimeout(()=>bell(f,i%2?.8:-.8),i*480))},
whisp=()=>{for(let i=0;i<5;i++)setTimeout(()=>nz(.5,.18,3500+rnd()*1500,'bandpass',rnd()*2-1,.2),i*260)};
/* ---------- VOICE ---------- */
let subT;function say(t,cb){let s=$('#sub');s.textContent=t;clearTimeout(subT);subT=setTimeout(()=>{s.textContent=''},Math.max(3500,t.length*95));if(cb)setTimeout(cb,Math.max(2600,t.length*90));if(!mV||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/[…—]/g,','));u.lang='th-TH';let v=speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang));if(v)u.voice=v;u.rate=.8;u.pitch=.6;speechSynthesis.speak(u)}
const tv=()=>{mV=!mV;if(!mV)speechSynthesis.cancel();$('#bv').textContent='🗣 เสียงพูด: '+(mV?'เปิด':'ปิด')},ts_=()=>{mS=!mS;if(MG)MG.gain.value=mS?.8:0;$('#bs').textContent='🎧 เสียงบรรยากาศ: '+(mS?'เปิด':'ปิด')};
/* ---------- STORY ---------- */
const NT={1:['บันทึกของแม่','คืนวันเกิดครบเจ็ดขวบของลูกชายคนเล็ก ท่านพ่อบอกว่าจะทำพิธีให้เราอยู่ด้วยกันตลอดไป ฉันกลัวเหลือเกิน เขาตัดหัวคนในรูปถ่ายของเราทุกใบ แล้วเขียนด้วยเลือดว่า: ผู้สูงที่สุดยืนซ้ายสุด คนเล็กยืนขวาสุดข้างแม่ พี่สาวคั่นกลางระหว่างพ่อกับแม่ เรียงให้ถูก ประตูจึงจะเปิด'],
2:['แฟ้มคดีที่ยับเยิน','ศพทั้งหกเรียงเป็นวงกลม ไม่พบเด็กชายอายุเจ็ดขวบ โทรศัพท์แจ้งเหตุมาจากในบ้านเอง เป็นเสียงเด็กกระซิบว่า มาหาผมที ผมซ่อนอยู่ ... วันที่ในแฟ้มคือเมื่อยี่สิบปีก่อน'],
3:['กระดาษโน้ตของพี่สาว','พี่ซ่อนน้องไว้ใต้เปียโน บอกให้ฟังเพลงกล่อมจนกว่าเสียงข้างนอกจะเงียบ พี่กดโน้ตสามห้าสามสอง เพลงเดียวกันที่ใช้กล่อมน้องทุกคืน'],
4:['หน้าสุดท้ายในตำราพิธี','ท่านพ่อไม่ได้ชั่วตั้งแต่แรก เขาแค่ไม่ยอมให้แม่ตาย ตำรากล่าวไว้ว่า หกชีวิตเป็นเครื่องบูชา หนึ่งชีวิตเป็นภาชนะ ภาชนะต้องเป็นสายเลือด ต้องเป็นเด็ก และต้องไม่ตายในคืนนั้น'],
5:['รูปครอบครัวเก่า','ในรูป เด็กชายตัวเล็กยืนขวาสุด มีรอยแผลเป็นที่คิ้วซ้าย ... คุณยกมือแตะคิ้วตัวเอง มันเป็นรอยแผลเดียวกัน คุณจำได้ทันทีว่ารอยนั้นได้มาจากการล้มตรงขั้นบันไดคืนนั้น'],
6:['รอยขีดข่วนบนพื้น','เวลาตายของนาฬิกาคือเวลาที่เสียงร้องสุดท้ายดับ พี่บอกว่าถ้าวันหนึ่งเธอกลับมา ให้นับศพ แล้วดูเข็มนาฬิกา มันคือกุญแจของทุกอย่าง'],
7:['จดหมายถึงภูมิ','ภูมิ ถ้าเธออ่านอยู่ แปลว่าพี่ทำสำเร็จแล้ว เธอไม่ได้มาสืบคดี เธอกลับบ้าน พี่ไม่ได้ตาย เราแค่ติดอยู่ ท่านพ่ออยู่ในกระจก มันรอเธอมายี่สิบปี เลือกเถอะ แต่ถ้าเธออยากให้ทุกคนหลับ ให้ยอมรับว่าเราเคยมีกันอยู่จริง']};
const P={pa:[130,'พ่อ'],sis:[100,'พี่สาว'],mom:[115,'แม่'],kid:[70,'เด็กน้อย']},ANS=['pa','sis','mom','kid'];
const WH=['ภูมิ... กลับมาแล้วเหรอ','เล่นซ่อนแอบกันอีกนะ','พี่ยังรออยู่ตรงนี้','อย่ามองข้างหลัง','เขาอยู่ข้างหลังเธอ','เธอจำชื่อตัวเองไม่ได้ใช่ไหม'],
TL=['ลมหายใจเย็นๆ ข้างหูฉัน...','ของบางอย่างไม่ได้อยู่ที่เดิม','มีบางอย่างขยับตอนฉันไม่มอง','ไม้พื้นลั่นเอี๊ยดอยู่ด้านหลัง','เงาของฉันขยับช้ากว่าตัวฉัน'];
const EN={free:['ปลดปล่อย','คุณเผาตำราพิธีด้วยเปลวเทียนเลือด เสียงกรีดร้องสิบหกเสียงดังขึ้นพร้อมกัน แล้วเงียบ กระจกแตกเป็นผง คุณเดินออกจากบ้านทั้งที่ยังจำชื่อตัวเองไม่ได้ แต่ข้างหลัง ไฟทุกดวงในคฤหาสน์ดับลงอย่างสงบเป็นครั้งแรกในรอบยี่สิบปี'],
vessel:['ภาชนะ','คุณทำพิธีต่อจนจบ เลือดไหลขึ้นตามผนัง ผู้หญิงในชุดขาวลืมตา เธอกอดคุณแน่นแล้วกระซิบว่าขอบใจนะลูก ร่างของคุณค่อยๆ ว่างเปล่า เสียงของคุณดังออกมาจากปากคนอื่น แล้วคฤหาสน์หลังนี้ก็รอนักสืบคนต่อไป'],
loop:['วนซ้ำ','คุณวิ่งออกประตูหน้า ฝนตกหนัก คุณเห็นรถตำรวจจอดอยู่ ในมือคือแฟ้มคดีเปียกเลือด ชื่อบนบัตรถูกขีดฆ่า ฉันไม่รู้ว่าตัวเองชื่ออะไร... คุณเงยหน้ามองคฤหาสน์ ในหน้าต่างบานบนสุด มีเด็กชายคนหนึ่งโบกมือ และมันคือคุณ'],
killer:['เงาในกระจก','คุณทุบกระจกด้วยด้ามไฟฉาย เศษแก้วทุกชิ้นสะท้อนใบหน้าคุณที่กำลังยิ้ม มือคุณไม่ใช่มือของคุณอีกแล้ว ท่านพ่อก้าวออกมาจากเงา สวมร่างคุณเหมือนเสื้อคลุมตัวเก่า เสียงเขาหัวเราะใกล้หูคุณ อยู่ข้างในหัวคุณ ตลอดไป'],
true:['กลับบ้าน (จบที่แท้จริง)','คุณวางกล่องดนตรีลงบนแท่น ยอมรับชื่อ ภูมิ และความทรงจำทุกอย่างพรั่งพรูกลับมา พี่สาวกับแม่ยืนอยู่ข้างคุณ ไม่มีเลือดอีกแล้ว กระจกร้าวแล้วปล่อยท่านพ่อให้หลับไปอย่างสงบ เด็กชายเจ็ดขวบเดินออกจากห้องที่เจ็ดพร้อมครอบครัว ท่ามกลางแสงแรกของวัน'],
mad:['สติแตกสลาย','เสียงกระซิบดังกว่าความคิดของคุณ ผนังหายใจ หุ่นเชิดยืนอยู่ตรงหน้าคุณมานานแล้ว คุณหัวเราะ คุณร้องเพลงกล่อม คุณไม่ใช่นักสืบ ไม่ใช่เด็กชาย คุณเป็นเพียงอีกหนึ่งเงาในบ้านหลังนี้']};
/* ---------- DRAWING ---------- */
function shell(a,b,f){let g=X.createLinearGradient(0,0,0,380);g.addColorStop(0,a);g.addColorStop(1,b);X.fillStyle=g;X.fillRect(0,0,W,380);g=X.createLinearGradient(0,380,0,H);g.addColorStop(0,f);g.addColorStop(1,'#050303');X.fillStyle=g;X.fillRect(0,380,W,180);X.strokeStyle='rgba(0,0,0,.45)';for(let i=0;i<12;i++){X.beginPath();X.moveTo(500+(i-5.5)*25,380);X.lineTo(500+(i-5.5)*160,H);X.stroke()}for(let y=400;y<H;y+=30){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.fillStyle='rgba(0,0,0,.25)';for(let x=0;x<W;x+=40)X.fillRect(x,0,10,380)}
function door(x,y,w,h,id,l,open){R(open?'#000':'#2a1608',x,y,w,h);if(!open){R('#3a200d',x+8,y+10,w-16,h/2-14);R('#3a200d',x+8,y+h/2+4,w-16,h/2-14);R('#b8a060',x+w-18,y+h/2,6,6)}X.strokeStyle='#120a05';X.lineWidth=6;X.strokeRect(x,y,w,h);hs(id,x,y,w,h,l)}
function blood(x,y,s,sd){X.save();X.fillStyle='rgba(95,0,0,.88)';let r=sd;const n=()=>(r=(r*9301+49297)%233280)/233280;for(let i=0;i<10;i++){X.beginPath();X.ellipse(x+(n()-.5)*s,y+(n()-.5)*s*.6,n()*s/4+3,n()*s/7+2,0,0,7);X.fill()}X.restore()}

function bx(){if(S.d.join('')=='642'){S.key=1;modal('<h2>กล่องเปิดแล้ว</h2><p>ข้างในมีกุญแจสนิมเขรอะ ผูกด้วยเส้นผมเด็ก และกล่องดนตรีใบเล็ก</p>');say('มีกุญแจห้องใต้ดิน และกล่องดนตรี ... ที่ฉันเคยกอดทุกคืน');S.gotbox=1}else{cl();say('ผิด ... กล่องกำลังหัวเราะ');san(-6);jump()}}
function altar(){let h='<h2>แท่นบูชาห้องที่เจ็ด</h2><p>ตำราพิธี หกเทียนเลือด และเก้าอี้เด็กว่างเปล่า ความจริงอยู่ตรงหน้าคุณแล้ว ... คุณคือเด็กชายที่รอดชีวิต เลือกเถอะ</p><button onclick="ending(\'free\')">เผาตำราพิธี</button> <button onclick="ending(\'vessel\')">ทำพิธีให้จบ</button> <button onclick="ending(\'loop\')">หนีออกจากบ้าน</button> ';if(S.notes.length>=7&&S.gotbox&&S.san>30)h+='<button onclick="ending(\'true\')">วางกล่องดนตรีลงบนแท่น</button>';else h+='<p style="color:#744">(มีทางเลือกที่ยังมองไม่เห็น... อ่านบันทึกให้ครบ รักษาสติไว้)</p>';modal(h,1)}
function ending(k){if(S.over)return;S.over=1;cl();let e=EN[k];lull();scream();let h='<h2 style="font-size:32px">'+e[0]+'</h2><p>'+e[1]+'</p><p style="color:#a66">จบแบบที่ '+(Object.keys(EN).indexOf(k)+1)+' จาก 6 · บันทึกที่พบ '+S.notes.length+'/7</p><button onclick="location.reload()">เริ่มใหม่</button>';setTimeout(()=>{modal(h,1);say(e[1])},k=='mad'?200:1200)}
function click(){if(!S.go||S.over||Mo.style.display=='flex')return;let h=hover();if(!h)return;let i=h.id;
const m={n1:()=>note(1),n2:()=>note(2),n3:()=>note(3),n4:()=>note(4),n5:()=>note(5),n6:()=>note(6),n7:()=>note(7),
frame:photo,piano:pno,box,altar,pup:()=>{say('หุ่นเชิดหันศีรษะมามองฉัน ... โดยที่ไม่มีใครดึงสาย');jump()},
door:()=>S.photo?go('music','เสียงลมหายใจเด็กดังจากในห้อง'):say('ประตูล็อกอยู่ ต้องต่อรูปถ่ายครอบครัวในกรอบรูปให้ถูกก่อน'),
exit:()=>say('ประตูถูกตอกตายด้วยตะปูสนิมนับร้อยตัว ฉันยังออกไปไม่ได้'),
toHall:()=>go('hall','เสียงเปียโนดังตามหลังฉันมา'),toStudy:()=>go('study','ห้องทำงานของท่านพ่อ ... ฉันรู้จักกลิ่นนี้'),toMusic:()=>go('music'),
bk:()=>say('ชั้นหนังสือหนักอึ้ง มีเสียงเด็กฮัมเพลงอยู่ข้างหลังมัน'),
scrawl:()=>say('สามตายก่อน ห้าตามมา สามถูกฆ่าซ้ำ สองปิดท้าย ... เหมือนลำดับของโน้ต'),
wall:()=>say('ศพที่นับได้หกร่าง ชั่วโมงที่นาฬิกาตาย และเข็มยาวชี้เลขอะไร เอามาต่อกันเป็นรหัส'),
clock:()=>say('นาฬิกาหยุดที่สี่นาฬิกาสิบนาที เข็มสั้นชี้เลขสี่ เข็มยาวชี้เลขสอง'),
toCellar:()=>S.key?go('cellar','บันไดลงห้องใต้ดินเย็นยะเยือก มีคนรออยู่ข้างล่าง'):say('ประตูล็อกอยู่ ต้องมีกุญแจ'),toStudy2:()=>go('study'),
mbox:()=>{lull();say('เพลงกล่อมนี้ ... ฉันฮัมตามได้ทุกโน้ต');san(-4)},doll:()=>{say('ตุ๊กตาหันหน้ามาเอง ใบหน้ามันคือฉัน');san(-5);fx('sk')},
mirror:()=>{say('เงาในกระจกไม่ขยับตามฉัน ... มันยิ้ม');san(-8);setTimeout(jump,1500)},
cmirror:()=>{modal('<h2>กระจกร้าว</h2><p>เงาข้างในคือท่านพ่อ มันยิ้มและเรียกชื่อคุณ</p><button onclick="ending(\'killer\')">ทุบกระจก</button> <button onclick="cl()">ถอยออกมา</button>',1)},chair:()=>say('เก้าอี้ตัวเล็กตัวนี้ ฉันเคยนั่งดูพี่สาวเล่นเปียโน')};
if(['kid','pa','mom','sis'].includes(i)){if(!S.pc.includes(i)){S.pc.push(i);whisp();san(-3);say('พบชิ้นส่วนรูปถ่าย: '+P[i][1]+' ตัวที่ไม่มีศีรษะ ('+S.pc.length+'/4)');if(i=='mom')jump()}return}
(m[i]||(()=>{}))()}
function hover(){for(let k=cur.length-1;k>=0;k--){let o=cur[k];if(S.mx>=o.x&&S.mx<=o.x+o.w&&S.my>=o.y&&S.my<=o.y+o.h)return o}}
function mv(e){let t=e.touches?e.touches[0]:e,r=$('#d').getBoundingClientRect();S.mx=(t.clientX-r.left)/r.width*W;S.my=(t.clientY-r.top)/r.height*H;let h=hover(),tp=$('#tip');tp.textContent=h?h.l:'';tp.style.left=(t.clientX-r.left)+'px';tp.style.top=(t.clientY-r.top)+'px';G.style.cursor=h?'pointer':'none'}
G.addEventListener('mousemove',mv);G.addEventListener('touchmove',e=>{mv(e);e.preventDefault()},{passive:false});G.addEventListener('touchstart',mv);G.addEventListener('click',e=>{mv(e);click()});
document.addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();turn()}});
(function loop(ts){S.t=ts;if(S.go&&!S.over){cur=[];draw();dark()}requestAnimationFrame(loop)})(0);
if(window.speechSynthesis)speechSynthesis.getVoices();
</script></body></html>
